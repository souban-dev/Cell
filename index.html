                  <button onClick={() => setIsCompareOpen(false)} className="px-5 py-2 rounded-xl bg-purple-600 text-white font-bold text-xs sm:text-sm shadow-sm">
                    Done Comparing
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* FOOTER */}
          <footer className="mt-12 bg-white border-t border-slate-200 py-6 text-center text-xs text-slate-500">
            <p>A project from Souban Chakraborty</p>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
